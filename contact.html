<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Coffee with ADHD — Contact</title>
  <meta name="description" content="Contact Coffee with ADHD for collabs, questions, or e-book requests." />
  <style>
    :root{--bg:#0b0f14;--muted:#93a4b7;--text:#eaf2ff;--line:rgba(255,255,255,.10);--accent:#caa46a;--accent2:#7bd3ff;--shadow:0 20px 60px rgba(0,0,0,.45);--radius:18px;--max:900px}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;line-height:1.5;color:var(--text);
      background: radial-gradient(1000px 600px at 20% 0%, rgba(202,164,106,.25), transparent 60%),
                  radial-gradient(900px 500px at 80% 10%, rgba(123,211,255,.20), transparent 55%),
                  var(--bg);}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--max);margin:0 auto;padding:22px}
    header{position:sticky;top:0;z-index:10;backdrop-filter:blur(14px);background:rgba(11,15,20,.55);border-bottom:1px solid var(--line)}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900}
    .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg, rgba(202,164,106,.95), rgba(123,211,255,.65));box-shadow:0 10px 28px rgba(0,0,0,.35);position:relative}
    .logo:after{content:"";position:absolute;inset:10px;border-radius:10px;border:1px solid rgba(0,0,0,.25);background:rgba(11,15,20,.35)}
    nav a{color:var(--muted);font-size:14px;padding:8px 10px;border-radius:12px}
    nav a:hover{background:rgba(255,255,255,.06);color:var(--text)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);font-weight:800;font-size:14px}
    .btn.primary{border-color:rgba(202,164,106,.45);background:linear-gradient(135deg, rgba(202,164,106,.30), rgba(123,211,255,.15))}
    .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.09)}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}
    h1{margin:16px 0 8px;font-size:36px;letter-spacing:-.6px}
    .muted{color:var(--muted)}
    form{display:grid;gap:10px;margin-top:12px}
    input, textarea{
      width:100%; padding:12px 12px; border-radius:14px; border:1px solid var(--line);
      background: rgba(11,15,20,.35); color: var(--text); outline:none;
      font-family:inherit; font-size:14px;
    }
    textarea{min-height:130px; resize:vertical}
    footer{padding:24px 0 40px;color:var(--muted);border-top:1px solid var(--line);margin-top:24px}
    .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .small{font-size:13px}
    @media (max-width:900px){ nav{display:none} }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="nav">
        <a class="brand" href="index.html">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <div style="font-size:14px;">coffee with adhd</div>
            <div style="font-size:12px;color:var(--muted);font-weight:800;">Contact</div>
          </div>
        </a>
        <nav>
          <a href="index.html">Home</a>
          <a href="recipes.html">Coffee e-book recipes</a>
          <a href="contact.html">Contact</a>
        </nav>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <a class="btn" href="index.html">← Back</a>
          <a class="btn primary" href="https://instagram.com/coffeewithadhd" target="_blank" rel="noreferrer">Instagram</a>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="card">
      <h1>Contact</h1>
      <p class="muted">
        For questions, collabs, or e-book requests, the fastest way is Instagram DM:
        <b>@coffeewithadhd</b>.  
        You can also use the form below (demo).
      </p>

      <!-- NOTE: This form is a demo (no backend). For a real form, I can connect Formspree/Web3Forms. -->
      <form onsubmit="event.preventDefault(); alert('Thanks! This is a demo form. If you want, I can connect it to a real email service (Formspree/Web3Forms).');">
        <input type="text" name="name" placeholder="Your name" required />
        <input type="email" name="email" placeholder="Your email" required />
        <textarea name="message" placeholder="Your message (collab / question / e-book request)..." required></textarea>
        <button class="btn primary" type="submit">Send message</button>
      </form>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
        <a class="btn" href="recipes.html">See recipes</a>
        <a class="btn" href="https://instagram.com/coffeewithadhd" target="_blank" rel="noreferrer">DM on Instagram</a>
      </div>
    </div>

    <footer class="wrap">
      <div class="row small">
        <div>© <span id="y"></span> coffee with adhd</div>
        <div><a class="btn" href="recipes.html">Recipes</a> <a class="btn" href="index.html">Home</a></div>
      </div>
    </footer>
  </main>

  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
